name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # GITHUB_TOKEN works for public data. If you want private repos
          # counted too, create a classic Personal Access Token with
          # 'repo' scope, save it as a secret named SUMMARY_PAT, and swap
          # the line below to: GITHUB_TOKEN: ${{ secrets.SUMMARY_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
