<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <!-- subtle grid lines for a technical feel -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="220" x2="1000" y2="220"/>
    <line x1="150" y1="0" x2="150" y2="260"/>
    <line x1="850" y1="0" x2="850" y2="260"/>
  </g>

  <!-- decorative code brackets -->
  <text x="60" y="150" font-family="Consolas, Menlo, monospace" font-size="120" fill="#ffffff" fill-opacity="0.06" font-weight="bold">&lt;/&gt;</text>

  <!-- floating dots -->
  <circle cx="900" cy="60" r="4" fill="#06b6d4" opacity="0.8"/>
  <circle cx="930" cy="90" r="3" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="870" cy="110" r="2.5" fill="#6366f1" opacity="0.7"/>
  <circle cx="70" cy="210" r="3" fill="#06b6d4" opacity="0.6"/>
  <circle cx="110" cy="40" r="2" fill="#8b5cf6" opacity="0.6"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="8" height="260" fill="url(#accent)"/>

  <!-- name -->
  <text x="200" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Fazal Rahman Waqar</text>

  <!-- title -->
  <text x="200" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#a5b4fc">Full Stack Web Developer &amp; AI Engineer</text>

  <!-- tag pills -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">
    <rect x="200" y="172" width="70" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="215" y="188">Python</text>

    <rect x="278" y="172" width="56" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="292" y="188">C#</text>

    <rect x="342" y="172" width="90" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="356" y="188">JavaScript</text>

    <rect x="440" y="172" width="72" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="454" y="188">Django</text>

    <rect x="520" y="172" width="66" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="534" y="188">React</text>

    <rect x="594" y="172" width="112" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="608" y="188">ASP.NET Core</text>

    <rect x="714" y="172" width="176" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <text x="728" y="188">Deep Learning &amp; CV</text>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="256" width="1000" height="4" fill="url(#accent)"/>
</svg>
